name: Patched Node Runtime Certification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: trusted-main-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_commit: ${{ steps.identity.outputs.source_commit }}
    steps:
      - name: Fail closed unless this is the trusted public main workflow
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" = 'rojitasnico21-hub/node-openssl-security-runtime' ]]
          [[ "$GITHUB_EVENT_NAME" = workflow_dispatch ]]
          [[ "$GITHUB_REF" = refs/heads/main ]]
          [[ "$GITHUB_WORKFLOW_REF" = 'rojitasnico21-hub/node-openssl-security-runtime/.github/workflows/certify.yml@refs/heads/main' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'source_commit=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Enforce manifest, workflow, license, and promotion policy
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-build-manifest.mjs BUILD_MANIFEST.json \
            patches/openssl-CVE-2026-14456-official.patch \
            patches/openssl-CVE-2026-14456-node-22.23.2.patch
          node scripts/verify-publication-policy.mjs

  headers:
    name: generated-headers-${{ matrix.arch }}
    needs: policy
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            nasm_file: nasm_2.16.01-1_amd64.deb
            nasm_sha: 0180693ad5d2da8b36e7d73b9b596dc3e9f900238e3de699976c0576875b878f
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            nasm_file: nasm_2.16.01-1_arm64.deb
            nasm_sha: 291e7bd6c76358bc44f0a5b5dae2320f3d63f6a1da004d70b3f024de5f5fa493
    runs-on: ${{ matrix.runner }}
    # Three independently reconstructed patched generations plus the baseline
    # are required for strict all-header reproducibility evidence.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.policy.outputs.source_commit }}
          persist-credentials: false
          fetch-depth: 1
      - name: Prove native runner architecture before generation
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.arch }}' in
            amd64) [[ "$(uname -m)" = x86_64 ]] ;;
            arm64) [[ "$(uname -m)" = aarch64 ]] ;;
          esac
      - name: Install verified Buildx and pinned BuildKit daemon
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          bash scripts/install-buildx.sh '${{ matrix.arch }}' BUILD_MANIFEST.json "$DOCKER_CONFIG"
          bash scripts/configure-buildkit.sh '${{ matrix.arch }}' BUILD_MANIFEST.json "$DOCKER_CONFIG" "runtime-${{ matrix.arch }}-$GITHUB_RUN_ID"
      - name: Fetch verified public source inputs
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/fetch-verified-inputs.sh BUILD_MANIFEST.json "$RUNNER_TEMP/inputs"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2 \
            --output "$RUNNER_TEMP/inputs/${{ matrix.nasm_file }}" \
            "https://deb.debian.org/debian/pool/main/n/nasm/${{ matrix.nasm_file }}"
          printf '%s  %s\n' '${{ matrix.nasm_sha }}' "$RUNNER_TEMP/inputs/${{ matrix.nasm_file }}" | sha256sum -c -
      - name: Build exact builder and regenerate headers
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          context="$RUNNER_TEMP/builder-context"
          mkdir -p "$context" "$RUNNER_TEMP/nasm" "$RUNNER_TEMP/headers"
          cp Dockerfile.builder "$context/Dockerfile.builder"
          cp "$RUNNER_TEMP/inputs/libtext-template-perl_1.61-1_all.deb" "$context/"
          docker buildx build --platform '${{ matrix.platform }}' --load \
            --file "$context/Dockerfile.builder" \
            --build-arg NODE_BUILD_BASE="$(node -p 'require("./BUILD_MANIFEST.json").images.nodeBuildBase.image+"@"+require("./BUILD_MANIFEST.json").images.nodeBuildBase.indexDigest')" \
            --build-arg TEXT_TEMPLATE_DEB_SHA256="$(node -p 'require("./BUILD_MANIFEST.json").dependencies.textTemplate.sha256')" \
            --tag "public/patched-node-builder:${{ matrix.arch }}" "$context"
          dpkg-deb -x "$RUNNER_TEMP/inputs/${{ matrix.nasm_file }}" "$RUNNER_TEMP/nasm"
          docker run --rm --network none --platform '${{ matrix.platform }}' \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/inputs:/inputs:ro" \
            -v "$RUNNER_TEMP/nasm:/opt/nasm:ro" -v "$RUNNER_TEMP/headers:/out" \
            "public/patched-node-builder:${{ matrix.arch }}" bash -ceu '
              export PATH=/opt/nasm/usr/bin:$PATH
              perl -MText::Template -e 1
              bash /src/scripts/build-node.sh --headers-only ${{ matrix.arch }} \
                /inputs/node.tar.xz /inputs/openssl.tar.gz /inputs/official.patch \
                /src/patches/openssl-CVE-2026-14456-node-22.23.2.patch /out
            '
          grep -R -F '#define SSL_VALUE_QUIC_MAX_PENDING_CONNS 16' "$RUNNER_TEMP/headers/evidence/generated-headers/patched"

  certify:
    name: certify-${{ matrix.arch }}
    needs: [policy, headers]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            nasm_file: nasm_2.16.01-1_amd64.deb
            nasm_sha: 0180693ad5d2da8b36e7d73b9b596dc3e9f900238e3de699976c0576875b878f
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            nasm_file: nasm_2.16.01-1_arm64.deb
            nasm_sha: 291e7bd6c76358bc44f0a5b5dae2320f3d63f6a1da004d70b3f024de5f5fa493
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.policy.outputs.source_commit }}
          persist-credentials: false
          fetch-depth: 1
      - name: Prove native runner architecture before build
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.arch }}' in
            amd64) [[ "$(uname -m)" = x86_64 ]] ;;
            arm64) [[ "$(uname -m)" = aarch64 ]] ;;
          esac
      - name: Install verified Buildx and pinned BuildKit daemon
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          bash scripts/install-buildx.sh '${{ matrix.arch }}' BUILD_MANIFEST.json "$DOCKER_CONFIG"
          bash scripts/configure-buildkit.sh '${{ matrix.arch }}' BUILD_MANIFEST.json "$DOCKER_CONFIG" "runtime-${{ matrix.arch }}-$GITHUB_RUN_ID"
      - name: Fetch verified public source inputs
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/fetch-verified-inputs.sh BUILD_MANIFEST.json "$RUNNER_TEMP/inputs"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2 \
            --output "$RUNNER_TEMP/inputs/${{ matrix.nasm_file }}" \
            "https://deb.debian.org/debian/pool/main/n/nasm/${{ matrix.nasm_file }}"
          printf '%s  %s\n' '${{ matrix.nasm_sha }}' "$RUNNER_TEMP/inputs/${{ matrix.nasm_file }}" | sha256sum -c -
      - name: Build, execute, and bind the patched runtime to this architecture
        shell: bash
        env:
          CERT_SOURCE_REPOSITORY: ${{ github.repository }}
          CERT_SOURCE_COMMIT: ${{ needs.policy.outputs.source_commit }}
          CERT_SOURCE_REF: ${{ github.ref }}
          CERT_WORKFLOW_PATH: .github/workflows/certify.yml
          CERT_WORKFLOW_COMMIT: ${{ github.sha }}
          CERT_RUN_ID: ${{ github.run_id }}
          CERT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          context="$RUNNER_TEMP/builder-context"
          mkdir -p "$context" "$RUNNER_TEMP/nasm" "$RUNNER_TEMP/runtime"
          cp Dockerfile.builder "$context/Dockerfile.builder"
          cp "$RUNNER_TEMP/inputs/libtext-template-perl_1.61-1_all.deb" "$context/"
          docker buildx build --platform '${{ matrix.platform }}' --load \
            --file "$context/Dockerfile.builder" \
            --build-arg NODE_BUILD_BASE="$(node -p 'require("./BUILD_MANIFEST.json").images.nodeBuildBase.image+"@"+require("./BUILD_MANIFEST.json").images.nodeBuildBase.indexDigest')" \
            --build-arg TEXT_TEMPLATE_DEB_SHA256="$(node -p 'require("./BUILD_MANIFEST.json").dependencies.textTemplate.sha256')" \
            --tag "public/patched-node-builder:${{ matrix.arch }}" "$context"
          dpkg-deb -x "$RUNNER_TEMP/inputs/${{ matrix.nasm_file }}" "$RUNNER_TEMP/nasm"
          docker run --rm --network none --platform '${{ matrix.platform }}' \
            -e CERT_SOURCE_REPOSITORY -e CERT_SOURCE_COMMIT -e CERT_SOURCE_REF \
            -e CERT_WORKFLOW_PATH -e CERT_WORKFLOW_COMMIT -e CERT_RUN_ID -e CERT_RUN_ATTEMPT \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/inputs:/inputs:ro" \
            -v "$RUNNER_TEMP/nasm:/opt/nasm:ro" -v "$RUNNER_TEMP/runtime:/out" \
            "public/patched-node-builder:${{ matrix.arch }}" bash -ceu '
              export PATH=/opt/nasm/usr/bin:$PATH
              perl -MText::Template -e 1
              bash /src/scripts/build-node.sh ${{ matrix.arch }} /inputs/node.tar.xz \
                /inputs/openssl.tar.gz /inputs/official.patch \
                /src/patches/openssl-CVE-2026-14456-node-22.23.2.patch /out
            '
          bash scripts/verify-architecture.sh '${{ matrix.arch }}' "$RUNNER_TEMP/runtime/nodejs/bin/node" "$RUNNER_TEMP/runtime/evidence/RUNTIME_PROVENANCE.json"
          bash scripts/verify-runtime.sh '${{ matrix.arch }}' "$RUNNER_TEMP/runtime"
      - name: Install verified Trivy and retain database identity
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install-trivy.sh '${{ matrix.arch }}' BUILD_MANIFEST.json "$RUNNER_TEMP/trivy-bin"
          export TRIVY_CACHE_DIR="$RUNNER_TEMP/trivy-cache"
          "$RUNNER_TEMP/trivy-bin/trivy" image --download-db-only
          node scripts/record-trivy-db.mjs "$TRIVY_CACHE_DIR" '0.74.0' "$RUNNER_TEMP/runtime/evidence/TRIVY_DB.json"
      - name: Create retained SBOM and enforce HIGH/CRITICAL gate
        shell: bash
        run: |
          set -euo pipefail
          export TRIVY_CACHE_DIR="$RUNNER_TEMP/trivy-cache"
          trivy="$RUNNER_TEMP/trivy-bin/trivy"
          "$trivy" fs --skip-db-update --scanners vuln,secret --format cyclonedx \
            --output "$RUNNER_TEMP/runtime/evidence/SBOM.cdx.json" "$RUNNER_TEMP/runtime"
          "$trivy" fs --skip-db-update --scanners vuln,secret --format json \
            --output "$RUNNER_TEMP/runtime/evidence/TRIVY.json" "$RUNNER_TEMP/runtime"
          "$trivy" fs --skip-db-update --scanners vuln,secret --severity HIGH,CRITICAL \
            --exit-code 1 "$RUNNER_TEMP/runtime"
      - name: Assemble deterministic success-only package
        shell: bash
        run: |
          set -euo pipefail
          epoch="$(node -p 'require("./BUILD_MANIFEST.json").sourceDateEpoch')"
          bash scripts/prepare-runtime-package.sh "$RUNNER_TEMP/runtime" "$epoch" "$RUNNER_TEMP/package"
      - name: Upload certified package and retained evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: certified-node-runtime-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/package
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostic-node-runtime-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/runtime/evidence
            ${{ runner.temp }}/headers/evidence
          if-no-files-found: ignore
          retention-days: 14
