name: Generated Header Reproducibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: trusted-main-reproducibility-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_commit: ${{ steps.identity.outputs.source_commit }}
    steps:
      - name: Fail closed unless this is the trusted public main workflow
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" = 'rojitasnico21-hub/node-openssl-security-runtime' ]]
          [[ "$GITHUB_EVENT_NAME" = workflow_dispatch ]]
          [[ "$GITHUB_REF" = refs/heads/main ]]
          [[ "$GITHUB_WORKFLOW_REF" = 'rojitasnico21-hub/node-openssl-security-runtime/.github/workflows/reproducibility.yml@refs/heads/main' ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'source_commit=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Enforce manifest and public workflow policy
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-build-manifest.mjs BUILD_MANIFEST.json \
            patches/openssl-CVE-2026-14456-official.patch \
            patches/openssl-CVE-2026-14456-node-22.23.2.patch
          node scripts/verify-publication-policy.mjs

  reproduce:
    name: reproduce-generated-headers-${{ matrix.arch }}
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            nasm_file: nasm_2.16.01-1_amd64.deb
            nasm_sha: 0180693ad5d2da8b36e7d73b9b596dc3e9f900238e3de699976c0576875b878f
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            nasm_file: nasm_2.16.01-1_arm64.deb
            nasm_sha: 291e7bd6c76358bc44f0a5b5dae2320f3d63f6a1da004d70b3f024de5f5fa493
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.policy.outputs.source_commit }}
          persist-credentials: false
          fetch-depth: 1
      - name: Prove native runner architecture before generation
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.arch }}' in
            amd64) [[ "$(uname -m)" = x86_64 ]] ;;
            arm64) [[ "$(uname -m)" = aarch64 ]] ;;
          esac
      - name: Install verified Buildx and pinned BuildKit daemon
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          bash scripts/install-buildx.sh '${{ matrix.arch }}' BUILD_MANIFEST.json "$DOCKER_CONFIG"
          bash scripts/configure-buildkit.sh '${{ matrix.arch }}' BUILD_MANIFEST.json "$DOCKER_CONFIG" "repro-${{ matrix.arch }}-$GITHUB_RUN_ID"
      - name: Fetch verified public source inputs
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/fetch-verified-inputs.sh BUILD_MANIFEST.json "$RUNNER_TEMP/inputs"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2 \
            --output "$RUNNER_TEMP/inputs/${{ matrix.nasm_file }}" \
            "https://deb.debian.org/debian/pool/main/n/nasm/${{ matrix.nasm_file }}"
          printf '%s  %s\n' '${{ matrix.nasm_sha }}' "$RUNNER_TEMP/inputs/${{ matrix.nasm_file }}" | sha256sum -c -
      - name: Generate and prove three-run reproducibility
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          context="$RUNNER_TEMP/builder-context"
          mkdir -p "$context" "$RUNNER_TEMP/nasm" "$RUNNER_TEMP/headers"
          cp Dockerfile.builder "$context/Dockerfile.builder"
          cp "$RUNNER_TEMP/inputs/libtext-template-perl_1.61-1_all.deb" "$context/"
          docker buildx build --platform '${{ matrix.platform }}' --load \
            --file "$context/Dockerfile.builder" \
            --build-arg NODE_BUILD_BASE="$(node -p 'require("./BUILD_MANIFEST.json").images.nodeBuildBase.image+"@"+require("./BUILD_MANIFEST.json").images.nodeBuildBase.indexDigest')" \
            --build-arg TEXT_TEMPLATE_DEB_SHA256="$(node -p 'require("./BUILD_MANIFEST.json").dependencies.textTemplate.sha256')" \
            --tag "public/patched-node-builder:repro-${{ matrix.arch }}" "$context"
          dpkg-deb -x "$RUNNER_TEMP/inputs/${{ matrix.nasm_file }}" "$RUNNER_TEMP/nasm"
          docker run --rm --network none --platform '${{ matrix.platform }}' \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/inputs:/inputs:ro" \
            -v "$RUNNER_TEMP/nasm:/opt/nasm:ro" -v "$RUNNER_TEMP/headers:/out" \
            "public/patched-node-builder:repro-${{ matrix.arch }}" bash -ceu '
              export PATH=/opt/nasm/usr/bin:$PATH
              perl -MText::Template -e 1
              bash /src/scripts/build-node.sh --headers-only ${{ matrix.arch }} \
                /inputs/node.tar.xz /inputs/openssl.tar.gz /inputs/official.patch \
                /src/patches/openssl-CVE-2026-14456-node-22.23.2.patch /out
            '
          report="$RUNNER_TEMP/headers/evidence/GENERATED_HEADER_REPRODUCIBILITY.json"
          input_report="$RUNNER_TEMP/headers/evidence/generated-header-inputs/PATCHED_INPUT_STATE_COMPARISON.json"
          [[ -f "$report" && -f "$input_report" ]]
          node - "$report" "$input_report" <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const inputs = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          if (inputs.identical !== true || inputs.independentlyReconstructed !== true) throw new Error("patched generator inputs are not identical independent reconstructions");
          if (report.policy?.id !== "RANLIB_CODE_POINTER_ASLR_V1") throw new Error("unexpected normalization policy");
          if (report.policy?.scope !== "evidence-copies-only") throw new Error("normalization escaped evidence copies");
          if (report.policy?.sourceGeneratorTreesMutated !== false) throw new Error("generator source mutation is forbidden");
          if (report.policy?.rawEvidencePreserved !== true) throw new Error("raw evidence was not preserved");
          if (report.policy?.rawSha256CoverageVerified !== true) throw new Error("raw SHA coverage was not verified");
          if (report.normalizedPatchedTreesByteIdentical !== true) throw new Error("three normalized patched generations differ");
          NODE
          normalized="$RUNNER_TEMP/headers/evidence/normalized-generated-headers"
          cmp "$normalized/patched/SHA256SUMS" "$normalized/repeat/SHA256SUMS"
          cmp "$normalized/repeat/SHA256SUMS" "$normalized/repeat-2/SHA256SUMS"
          cmp "$normalized/patched/SHA256SUMS" "$normalized/repeat-2/SHA256SUMS"
          grep -R -F '#define SSL_VALUE_QUIC_MAX_PENDING_CONNS 16' \
            "$RUNNER_TEMP/headers/evidence/generated-headers/patched"
      - name: Retain raw and normalized reproducibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: generated-header-reproducibility-${{ matrix.arch }}-${{ github.run_id }}
          path: ${{ runner.temp }}/headers/evidence
          if-no-files-found: ignore
          retention-days: 14
